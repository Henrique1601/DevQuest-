name: DevQuest CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      - name: Verificação Estrita de Tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Executar Testes Unitários (Vitest)
        run: npm run test

      - name: Build de Produção do Next.js
        run: npm run build

      - name: Instalar Navegador Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar Testes E2E (Playwright)
        run: npm run test:e2e
        env:
          CI: true

      - name: Fazer Upload dos Relatórios do Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
